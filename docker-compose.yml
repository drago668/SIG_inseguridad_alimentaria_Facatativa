services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: sig-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sig-postgres-data:/var/lib/postgresql/data
  web:
    build: .  
    container_name: mvp-web-1
    command: gunicorn sig_inseguridad.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120  
    restart: always
    volumes:
      - .:/app  
      - static_vol:/app/staticfiles
      - media_vol:/app/media
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sig-postgres:5432/${POSTGRES_DB}
    depends_on:
      - db 

volumes:
  sig-postgres-data:
    external: true
  static_vol:
  media_vol: