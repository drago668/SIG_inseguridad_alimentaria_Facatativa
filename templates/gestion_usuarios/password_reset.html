<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - SIG Facatativá</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 border border-slate-200">
        <div class="text-center mb-6">
            <h1 class="text-xl font-bold text-slate-800">Recuperar Contraseña</h1>
            <p class="text-xs text-slate-500 mt-2">Ingresa tu correo institucional y te enviaremos un enlace para restablecer tu acceso.</p>
        </div>

        <form method="POST" class="space-y-4">
            {% csrf_token %}
            <div>
                <label for="{{ form.email.id_for_label }}" class="block text-xs font-semibold text-slate-600 uppercase mb-1">Correo Electrónico</label>
                
                <input type="email" 
                    name="{{ form.email.html_name }}" 
                    id="{{ form.email.id_for_label }}" 
                    class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 text-sm focus:outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-colors" 
                    required>
                    
                {% if form.email.errors %}<span class="text-xs text-rose-500 block mt-1">{{ form.email.errors.0 }}</span>{% endif %}
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
                    Enviar enlace de recuperación
                </button>
            </div>
        </form>

        <div class="mt-6 text-center">
            <a href="{% url 'login' %}" class="text-xs font-medium text-teal-600 hover:text-teal-700 transition">
                Volver al inicio de sesión
            </a>
        </div>
    </div>
</body>
</html>
