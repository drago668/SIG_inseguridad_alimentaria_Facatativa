<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contraseña Actualizada - SIG Facatativá</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 min-h-screen flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-8 border border-slate-200 text-center">

        <div class="w-12 h-12 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-200">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
        </div>

        <h1 class="text-xl font-bold text-slate-800 mb-2">¡Contraseña actualizada!</h1>
        
        <p class="text-sm text-slate-600 mb-6">
            Tu contraseña ha sido restablecida con éxito. A partir de ahora debes usar tu nueva contraseña para acceder al sistema.
        </p>

        <a href="{% url 'login' %}" class="inline-block w-full bg-teal-600 hover:bg-teal-700 text-white font-medium py-2.5 rounded-lg transition shadow-md">
            Ir a Iniciar Sesión
        </a>
    </div>
</body>
</html>
